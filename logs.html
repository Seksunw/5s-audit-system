<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>บันทึกกิจกรรม | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px"><i class="bi bi-shield-lock me-1"></i>บันทึกกิจกรรม</div>
  <button class="btn-icon" onclick="initLogs()" title="รีเฟรช"><i class="bi bi-arrow-clockwise"></i></button>
</nav>

<div class="page-content" style="padding-bottom:24px;">
  <div class="log-filters" id="logFilters">
    <button class="lfchip active" onclick="logFilter('',this)">ทั้งหมด</button>
    <button class="lfchip" onclick="logFilter('LOGIN',this)">เข้าระบบ</button>
    <button class="lfchip" onclick="logFilter('SUBMIT_AUDIT',this)">ส่งผลตรวจ</button>
    <button class="lfchip" onclick="logFilter('schedules',this)">มอบหมาย</button>
    <button class="lfchip" onclick="logFilter('profiles',this)">ผู้ใช้</button>
    <button class="lfchip" onclick="logFilter('DELETE',this)">การลบ</button>
  </div>
  <div id="logList">
    <div class="skeleton" style="height:56px;border-radius:10px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:56px;border-radius:10px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:56px;border-radius:10px"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span>หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span>Dashboard</span></button>
  <button class="bottom-nav-item" onclick="navigate('users.html')"><i class="bi bi-people"></i><span>ผู้ใช้</span></button>
  <button class="bottom-nav-item active"><i class="bi bi-shield-lock"></i><span>Log</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=28"></script>
</body>
</html>
