<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <!-- Security headers (GitHub Pages ตั้ง HTTP header เองไม่ได้ จึงใช้ meta)
       ⚠️ ถ้าหน้าพัง/CDN โหลดไม่ขึ้น ให้ลบ 2 บรรทัดนี้ออกเพื่อย้อนกลับ
       'unsafe-inline' ยังต้องมีเพราะทุกหน้าใช้ inline onclick + <style> -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://oibjnkngraulcccdqevm.supabase.co; connect-src 'self' https://oibjnkngraulcccdqevm.supabase.co wss://oibjnkngraulcccdqevm.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>บันทึกกิจกรรม | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=53">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg" data-i18n="loading">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px"><i class="bi bi-shield-lock me-1"></i><span data-i18n="logs.title">บันทึกกิจกรรม</span></div>
  <button class="btn-icon" onclick="initLogs()" data-i18n-title="btn.refresh" title="รีเฟรช"><i class="bi bi-arrow-clockwise"></i></button>
</nav>

<div class="page-content" style="padding-bottom:24px;">
  <div class="log-filters" id="logFilters">
    <button class="lfchip active" onclick="logFilter('',this)" data-i18n="common.all">ทั้งหมด</button>
    <button class="lfchip" onclick="logFilter('LOGIN',this)" data-i18n="logs.filter_login">เข้าระบบ</button>
    <button class="lfchip" onclick="logFilter('SUBMIT_AUDIT',this)" data-i18n="logs.filter_submit">ส่งผลตรวจ</button>
    <button class="lfchip" onclick="logFilter('schedules',this)" data-i18n="logs.filter_assign">มอบหมาย</button>
    <button class="lfchip" onclick="logFilter('profiles',this)" data-i18n="logs.filter_users">ผู้ใช้</button>
    <button class="lfchip" onclick="logFilter('DELETE',this)" data-i18n="logs.filter_delete">การลบ</button>
  </div>
  <div id="logList">
    <div class="skeleton" style="height:56px;border-radius:10px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:56px;border-radius:10px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:56px;border-radius:10px"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span data-i18n="nav.home">หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span data-i18n="nav.dashboard">Dashboard</span></button>
  <button class="bottom-nav-item" onclick="navigate('users.html')"><i class="bi bi-people"></i><span data-i18n="nav.users">ผู้ใช้</span></button>
  <button class="bottom-nav-item active"><i class="bi bi-shield-lock"></i><span>Log</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=53"></script>
</body>
</html>
