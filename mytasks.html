<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1b4ea8">
  <title>งานที่ได้รับมอบหมาย | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=36">
</head>
<body>

<!-- Loading -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <span class="loading-msg" data-i18n="loading">กำลังโหลด...</span>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>

<!-- Top Nav -->
<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px"><i class="bi bi-person-check me-1"></i>งานที่ได้รับมอบหมาย</div>
  <button class="btn-icon" onclick="initMyTasks()" title="รีเฟรช"><i class="bi bi-arrow-clockwise"></i></button>
</nav>

<!-- Content -->
<div class="page-content">
  <div id="tasksSummary" style="font-size:0.82rem;color:var(--gray-600);font-weight:600;margin-bottom:12px"></div>
  <div id="myTasksList">
    <div class="skeleton" style="height:120px;border-radius:12px;margin-bottom:10px"></div>
    <div class="skeleton" style="height:120px;border-radius:12px;margin-bottom:10px"></div>
    <div class="skeleton" style="height:120px;border-radius:12px"></div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="bottom-nav-item" data-page="home" onclick="navigate('home.html')">
    <i class="bi bi-house"></i><span data-i18n="nav.home">หน้าหลัก</span>
  </button>
  <button class="bottom-nav-item active" data-page="mytasks">
    <i class="bi bi-clipboard-check"></i><span data-i18n="nav.audit">ตรวจ</span>
  </button>
  <button class="bottom-nav-item" data-page="history" onclick="navigate('history.html')">
    <i class="bi bi-clock-history"></i><span data-i18n="nav.history">ประวัติ</span>
  </button>
  <button class="bottom-nav-item" data-page="dashboard" onclick="navigate('dashboard.html')">
    <i class="bi bi-bar-chart"></i><span data-i18n="nav.dashboard">Dashboard</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=36"></script>
</body>
</html>
