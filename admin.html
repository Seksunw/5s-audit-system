<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>จัดการผู้ใช้ | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>

<!-- Loading -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <span class="loading-msg">กำลังโหลด...</span>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>

<!-- Top Nav -->
<nav class="top-nav">
  <div class="brand">
    <i class="bi bi-people"></i> จัดการผู้ใช้
  </div>
  <div class="nav-actions">
    <button class="btn-icon" onclick="logout()" title="ออกจากระบบ">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</nav>

<!-- Content -->
<div class="page-content">

  <!-- Filter Bar -->
  <div class="filter-bar">
    <input type="text" id="searchInput" class="form-control" placeholder="🔍 ค้นหาชื่อ หรือ email..."
           style="flex:1" oninput="filterUsers()">
    <select id="filterRole" class="filter-select" onchange="filterUsers()">
      <option value="">ทุก Role</option>
      <option value="Auditor">Auditor</option>
      <option value="Area Manager">Area Manager</option>
      <option value="Plant Manager">Plant Manager</option>
    </select>
    <select id="filterStatus" class="filter-select" onchange="filterUsers()">
      <option value="">ทุกสถานะ</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>

  <!-- User List -->
  <div id="userList">
    <div style="text-align:center;padding:40px;color:var(--gray-600)">
      <i class="bi bi-hourglass" style="font-size:2rem;display:block;margin-bottom:10px"></i>
      <p>กำลังโหลดข้อมูล...</p>
    </div>
  </div>

</div>

<!-- Add User Button -->
<button class="btn btn-primary btn-block btn-lg"
        style="position:fixed;bottom:80px;left:16px;right:16px;height:56px;font-size:1rem;z-index:100"
        onclick="openUserModal(null)">
  <i class="bi bi-plus-lg"></i> เพิ่มผู้ใช้งานใหม่
</button>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="bottom-nav-item" data-page="home" onclick="navigate('home.html')">
    <i class="bi bi-house"></i><span>หน้าหลัก</span>
  </button>
  <button class="bottom-nav-item" data-page="plant" onclick="navigate('plant.html')">
    <i class="bi bi-clipboard-check"></i><span>ตรวจ</span>
  </button>
  <button class="bottom-nav-item" data-page="history" onclick="navigate('history.html')">
    <i class="bi bi-clock-history"></i><span>ประวัติ</span>
  </button>
  <button class="bottom-nav-item" data-page="dashboard" onclick="navigate('dashboard.html')">
    <i class="bi bi-bar-chart"></i><span>Dashboard</span>
  </button>
  <button class="bottom-nav-item active" data-page="admin" onclick="navigate('admin.html')" id="adminNav">
    <i class="bi bi-gear"></i><span>Admin</span>
  </button>
</nav>

<!-- User Edit Modal -->
<div id="userModal" class="modal-overlay" style="display:none" onclick="if(event.target.id==='userModal') closeUserModal()">
  <div class="modal-card">
    <div class="modal-header">
      <span id="modalTitle">เพิ่มผู้ใช้งาน</span>
      <button class="btn-icon" onclick="closeUserModal()" style="font-size:1.5rem;color:#999">&times;</button>
    </div>

    <div class="modal-body">
      <form id="userForm" onsubmit="saveUser(event)">
        <input type="hidden" id="editUserId">

        <div class="form-group">
          <label class="form-label">ชื่อผู้ใช้ <span style="color:var(--danger)">*</span></label>
          <div class="input-group">
            <i class="bi bi-person input-icon"></i>
            <input type="text" id="userName" class="form-control" placeholder="ชื่อเต็ม" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">อีเมล <span style="color:var(--danger)">*</span></label>
          <div class="input-group">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" id="userEmail" class="form-control" placeholder="user@company.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">รหัสผ่าน <span style="color:var(--danger)">*</span></label>
          <div class="input-group">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" id="userPassword" class="form-control" placeholder="ตั้งรหัสผ่าน" required>
          </div>
          <div style="font-size:0.75rem;color:var(--gray-600);margin-top:4px">
            เฉพาะการสร้างผู้ใช้งานใหม่เท่านั้น
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">บทบาท <span style="color:var(--danger)">*</span></label>
          <select id="userRole" class="form-control" required>
            <option value="">-- เลือกบทบาท --</option>
            <option value="Auditor">Auditor (ผู้ตรวจ)</option>
            <option value="Area Manager">Area Manager (ผู้จัดการพื้นที่)</option>
            <option value="Plant Manager">Plant Manager (ผู้จัดการโรงงาน)</option>
            <option value="Admin">Admin (ผู้ดูแลระบบ)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">สถานะ</label>
          <select id="userStatus" class="form-control">
            <option value="active">🟢 Active (ใช้งาน)</option>
            <option value="inactive">🔴 Inactive (ไม่ใช้งาน)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">โรงงาน/Plant ที่มีสิทธิ์</label>
          <div id="plantsCheckbox" style="display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--gray-100);border-radius:8px">
            <!-- Dynamic plant checkboxes -->
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">พื้นที่/Area ที่มีสิทธิ์</label>
          <div id="areasCheckbox" style="display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--gray-100);border-radius:8px">
            <!-- Dynamic area checkboxes -->
          </div>
        </div>

        <div style="display:flex;gap:8px">
          <button type="submit" class="btn btn-primary btn-block">
            <i class="bi bi-check-lg"></i> บันทึก
          </button>
          <button type="button" class="btn btn-outline btn-block" onclick="closeUserModal()">
            <i class="bi bi-x-lg"></i> ยกเลิก
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=16"></script>
</body>
</html>
