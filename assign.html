<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ตารางตรวจ | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=26">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg" data-i18n="loading">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px"><i class="bi bi-clipboard-data me-1"></i>ตารางตรวจ</div>
  <button class="btn-icon" onclick="initAssign()" title="รีเฟรช">
    <i class="bi bi-arrow-clockwise"></i>
  </button>
</nav>

<div class="page-content">

  <!-- Filters -->
  <div class="asg-filters">
    <label>รอบ
      <select id="asgRound" onchange="renderAssign()"><option value="">ทุกรอบ</option></select>
    </label>
    <label>โรงงาน
      <select id="asgPlant" onchange="renderAssign()"><option value="">ทุกโรงงาน</option></select>
    </label>
  </div>

  <!-- KPI -->
  <div class="stat-grid mb-2">
    <div class="stat-card blue"><div class="stat-number" id="asgTotal">-</div><div class="stat-label">มอบทั้งหมด</div></div>
    <div class="stat-card green"><div class="stat-number" id="asgDone">-</div><div class="stat-label">ตรวจเสร็จ</div></div>
    <div class="stat-card yellow"><div class="stat-number" id="asgPending">-</div><div class="stat-label">ค้างตรวจ</div></div>
    <div class="stat-card red"><div class="stat-number" id="asgOverdue">-</div><div class="stat-label">เกินกำหนด</div></div>
  </div>

  <!-- Progress -->
  <div class="card mb-3" style="padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:0.8rem;color:var(--gray-600);font-weight:600">ความคืบหน้าการตรวจ</span>
      <span style="font-weight:800;font-size:0.95rem" id="asgProgPct">-</span>
    </div>
    <div class="asg-bar"><div class="asg-bar-fill" id="asgProgFill" style="width:0%"></div></div>
  </div>

  <!-- Per-auditor -->
  <div class="chart-container">
    <div class="chart-title">
      <i class="bi bi-people"></i> รายผู้ตรวจ
      <span style="font-weight:400;color:var(--gray-600);font-size:0.72rem">— แตะชื่อเพื่อดูพื้นที่ทั้งหมด</span>
    </div>
    <div id="asgAuditors">
      <div class="skeleton" style="height:44px;border-radius:8px;margin-bottom:6px"></div>
      <div class="skeleton" style="height:44px;border-radius:8px;margin-bottom:6px"></div>
      <div class="skeleton" style="height:44px;border-radius:8px"></div>
    </div>
    <div id="asgHint" style="font-size:0.72rem;color:var(--gray-600);margin-top:10px;line-height:1.5;display:none">
      <i class="bi bi-info-circle"></i> คะแนนเฉลี่ยที่ให้ = ตัวชี้ "ความเข้มงวด" ของผู้ตรวจ — สูง/ต่ำกว่าค่ากลางมากอาจต้องสอบเทียบมาตรฐาน
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span data-i18n="nav.home">หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('plant.html')"><i class="bi bi-clipboard-check"></i><span data-i18n="nav.audit">ตรวจ</span></button>
  <button class="bottom-nav-item" onclick="navigate('history.html')"><i class="bi bi-clock-history"></i><span data-i18n="nav.history">ประวัติ</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span data-i18n="nav.dashboard">Dashboard</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=26"></script>
</body>
</html>
