<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ผลการตรวจ | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-house"></i></button>
  <div class="brand" style="margin-left:8px">ผลการตรวจ</div>
  <button class="bottom-nav-item" onclick="navigate('admin.html')" id="adminNav" style="display:none"><i class="bi bi-gear"></i><span>Admin</span></button>
</nav>

<div class="page-content">

  <!-- Result Card -->
  <div class="result-card">
    <!-- Score Circle -->
    <div id="scoreCircle" class="score-circle need-improve">
      <span class="score-percent" id="resultPercent">-</span>
      <span class="score-percent-sign">%</span>
    </div>

    <!-- Status Badge -->
    <div id="statusBadge" class="status-badge status-need-improve">ประมวลผล...</div>

    <!-- Status Text -->
    <div style="font-weight:700;font-size:1.1rem;margin-bottom:6px" id="resultStatus">-</div>

    <!-- Score -->
    <div style="color:var(--gray-600);font-size:0.9rem">
      คะแนนที่ได้: <strong id="resultScore">-</strong> คะแนน
    </div>

    <!-- Audit ID -->
    <div style="color:var(--gray-600);font-size:0.75rem;margin-top:8px">
      Audit ID: <span id="resultAuditId">-</span>
    </div>
  </div>

  <!-- Score Guide -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="section-title mb-2"><i class="bi bi-award"></i> เกณฑ์คะแนน</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#e8f5e9">
          <div style="font-size:1.2rem">🏆</div>
          <div>
            <div style="font-weight:700;color:var(--excellent)">Excellent</div>
            <div style="font-size:0.8rem;color:var(--gray-600)">90-100% — ทำตามข้อกำหนดครบถ้วน</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#fff8e1">
          <div style="font-size:1.2rem">✅</div>
          <div>
            <div style="font-weight:700;color:#c9a000">Good</div>
            <div style="font-size:0.8rem;color:var(--gray-600)">75-89% — ทำได้ดีแต่ยังมีที่ปรับปรุง</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#fde8e8">
          <div style="font-size:1.2rem">⚠️</div>
          <div>
            <div style="font-weight:700;color:var(--danger)">Need Improvement</div>
            <div style="font-size:0.8rem;color:var(--gray-600)">0-74% — ต้องปรับปรุงอย่างเร่งด่วน</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
    <button class="btn btn-primary btn-block btn-lg" onclick="navigate('plant.html')">
      <i class="bi bi-clipboard-check"></i> ตรวจพื้นที่อื่น
    </button>
    <button class="btn btn-outline btn-block" onclick="navigate('history.html')">
      <i class="bi bi-clock-history"></i> ดูประวัติการตรวจทั้งหมด
    </button>
    <button class="btn btn-outline btn-block" onclick="navigate('dashboard.html')">
      <i class="bi bi-bar-chart"></i> ดู Dashboard
    </button>
  </div>

</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span>หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('plant.html')"><i class="bi bi-clipboard-check"></i><span>ตรวจ</span></button>
  <button class="bottom-nav-item" onclick="navigate('history.html')"><i class="bi bi-clock-history"></i><span>ประวัติ</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span>Dashboard</span></button>
  <button class="bottom-nav-item" onclick="navigate('admin.html')" id="adminNav" style="display:none"><i class="bi bi-gear"></i><span>Admin</span></button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
