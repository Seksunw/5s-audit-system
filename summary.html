
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <!-- Security headers (GitHub Pages ตั้ง HTTP header เองไม่ได้ จึงใช้ meta)
       ⚠️ ถ้าหน้าพัง/CDN โหลดไม่ขึ้น ให้ลบ 2 บรรทัดนี้ออกเพื่อย้อนกลับ
       'unsafe-inline' ยังต้องมีเพราะทุกหน้าใช้ inline onclick + <style> -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://oibjnkngraulcccdqevm.supabase.co; connect-src 'self' https://oibjnkngraulcccdqevm.supabase.co wss://oibjnkngraulcccdqevm.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ผลการตรวจ | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=49">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg" data-i18n="loading">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-house"></i></button>
  <div class="brand" style="margin-left:8px" data-i18n="summary.title">ผลการตรวจ</div>
</nav>

<div class="page-content">

  <!-- Result Card -->
  <div class="result-card">
    <!-- Score Circle -->
    <div id="scoreCircle" class="score-circle need-improve">
      <span class="score-percent" id="resultPercent">-</span>
      <span class="score-percent-sign">%</span>
    </div>

    <!-- Status Badge -->
    <div id="statusBadge" class="status-badge status-need-improve" data-i18n="summary.processing">ประมวลผล...</div>

    <!-- Status Text -->
    <div style="font-weight:700;font-size:1.1rem;margin-bottom:6px" id="resultStatus">-</div>

    <!-- Score -->
    <div style="color:var(--gray-600);font-size:0.9rem">
      <span data-i18n="summary.score_label">คะแนนที่ได้</span>: <strong id="resultScore">-</strong>
    </div>

    <!-- Audit ID -->
    <div style="color:var(--gray-600);font-size:0.75rem;margin-top:8px">
      <span data-i18n="summary.audit_id">Audit ID</span>: <span id="resultAuditId">-</span>
    </div>
  </div>

  <!-- Score Guide -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="section-title mb-2"><i class="bi bi-award"></i> <span data-i18n="summary.criteria">เกณฑ์คะแนน</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#e8f5e9">
          <div style="font-size:1.2rem">🏆</div>
          <div>
            <div style="font-weight:700;color:var(--excellent)" data-i18n="badge.excellent">Excellent</div>
            <div style="font-size:0.8rem;color:var(--gray-600)">90-100% — <span data-i18n="summary.ex_desc">ทำตามข้อกำหนดครบถ้วน</span></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#fff8e1">
          <div style="font-size:1.2rem">✅</div>
          <div>
            <div style="font-weight:700;color:#c9a000" data-i18n="badge.good">Good</div>
            <div style="font-size:0.8rem;color:var(--gray-600)">75-89% — <span data-i18n="summary.good_desc">ทำได้ดีแต่ยังมีที่ปรับปรุง</span></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#fde8e8">
          <div style="font-size:1.2rem">⚠️</div>
          <div>
            <div style="font-weight:700;color:var(--danger)" data-i18n="badge.need_improve">Need Improvement</div>
            <div style="font-size:0.8rem;color:var(--gray-600)">0-74% — <span data-i18n="summary.imp_desc">ต้องปรับปรุงอย่างเร่งด่วน</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
    <button class="btn btn-primary btn-block btn-lg" onclick="navigate('plant.html')">
      <i class="bi bi-clipboard-check"></i> <span data-i18n="summary.btn_other">ตรวจพื้นที่อื่น</span>
    </button>
    <button class="btn btn-outline btn-block" onclick="navigate('history.html')">
      <i class="bi bi-clock-history"></i> <span data-i18n="summary.btn_history">ดูประวัติการตรวจทั้งหมด</span>
    </button>
    <button class="btn btn-outline btn-block" onclick="navigate('dashboard.html')">
      <i class="bi bi-bar-chart"></i> <span data-i18n="summary.btn_dash">ดู Dashboard</span>
    </button>
  </div>

  <!-- ลบผลตรวจ — admin เท่านั้น (JS เปิดให้ ดู initSummary)
       จำเป็นเพราะผลตรวจถูกล็อกหลัง submit และตรวจซ้ำงานเดิมไม่ได้
       ถ้าตรวจผิด admin ต้องลบให้ก่อน auditor จึงตรวจใหม่ได้ -->
  <div id="sumAdminDel" style="display:none;margin-top:26px;
       border-top:1px solid var(--hairline);padding-top:16px">
    <p style="font-size:0.72rem;color:var(--gray-600);line-height:1.55;margin:0 0 10px;text-align:center"
       data-i18n="summary.del_hint">
      ลบผลตรวจใบนี้ถาวร (รวมรูปภาพ) · งานที่มอบหมายจะกลับเป็น "ค้าง" ให้ตรวจใหม่ได้
    </p>
    <button class="btn btn-block" style="background:var(--danger);color:#fff"
            onclick="deleteAuditResult()">
      <i class="bi bi-trash3"></i> <span data-i18n="summary.del_btn">ลบผลตรวจนี้</span>
    </button>
  </div>

</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span data-i18n="nav.home">หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('plant.html')"><i class="bi bi-clipboard-check"></i><span data-i18n="nav.audit">ตรวจ</span></button>
  <button class="bottom-nav-item" onclick="navigate('history.html')"><i class="bi bi-clock-history"></i><span data-i18n="nav.history">ประวัติ</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span data-i18n="nav.dashboard">Dashboard</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=49"></script>
</body>
</html>
