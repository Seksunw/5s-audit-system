<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <!-- Security headers (GitHub Pages ตั้ง HTTP header เองไม่ได้ จึงใช้ meta)
       ⚠️ ถ้าหน้าพัง/CDN โหลดไม่ขึ้น ให้ลบ 2 บรรทัดนี้ออกเพื่อย้อนกลับ
       'unsafe-inline' ยังต้องมีเพราะทุกหน้าใช้ inline onclick + <style> -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://oibjnkngraulcccdqevm.supabase.co; connect-src 'self' https://oibjnkngraulcccdqevm.supabase.co wss://oibjnkngraulcccdqevm.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>เลือก Plant | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=40">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg" data-i18n="loading">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px" data-i18n="plant.page_title">เลือก Plant</div>
  <div id="userInitial" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.2);
       color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700">U</div>
</nav>

<div class="page-content">
  <!-- Quick Links -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
    <button class="btn btn-outline btn-block" style="height:44px;font-size:0.82rem;"
            onclick="navigate('criteria.html')">
      <i class="bi bi-book me-1" style="color:var(--warning)"></i> มาตรฐาน 5ส
    </button>
    <button class="btn btn-outline btn-block" id="btnSchedule"
            style="display:none;height:44px;font-size:0.82rem;"
            onclick="navigate('schedule.html')">
      <i class="bi bi-diagram-3 me-1" style="color:#9334e6"></i> มอบหมายงาน
    </button>
  </div>

  <div class="section-title"><i class="bi bi-building"></i> <span data-i18n="plant.section">เลือกโรงงานที่ต้องการตรวจ</span></div>
  <p class="text-muted" style="font-size:0.85rem;margin-bottom:16px">
    รองรับ 3 Plant ตามมาตรฐาน 5ส Draft 2026
  </p>

  <div id="plantGrid" class="plant-grid">
    <!-- ดึงข้อมูลจาก API -->
    <div class="skeleton" style="height:80px;border-radius:12px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px"></div>
  </div>

  <!-- Step indicator -->
  <div style="margin-top:24px;padding:16px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm)">
    <div class="section-title" style="margin-bottom:12px"><i class="bi bi-list-check"></i> <span data-i18n="plant.steps_title">ขั้นตอนการตรวจ</span></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;
                    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">1</div>
        <div style="font-size:0.85rem" data-i18n="plant.step1">เลือก Plant — โรงงานที่ต้องการตรวจ</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--gray-300);color:var(--gray-600);
                    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">2</div>
        <div style="font-size:0.85rem;color:var(--gray-600)" data-i18n="plant.step2">เลือกพื้นที่ (Area) ที่ต้องการตรวจ</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--gray-300);color:var(--gray-600);
                    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">3</div>
        <div style="font-size:0.85rem;color:var(--gray-600)" data-i18n="plant.step3">ทำ Checklist และให้คะแนน</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--gray-300);color:var(--gray-600);
                    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">4</div>
        <div style="font-size:0.85rem;color:var(--gray-600)" data-i18n="plant.step4">Submit และดูผล</div>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span data-i18n="nav.home">หน้าหลัก</span></button>
  <button class="bottom-nav-item active" data-page="plant"><i class="bi bi-clipboard-check"></i><span data-i18n="nav.audit">ตรวจ</span></button>
  <button class="bottom-nav-item" onclick="navigate('history.html')"><i class="bi bi-clock-history"></i><span data-i18n="nav.history">ประวัติ</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span data-i18n="nav.dashboard">Dashboard</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=40"></script>
</body>
</html>
