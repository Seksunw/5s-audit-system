<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>เลือก Plant | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px">เลือก Plant</div>
  <div id="userInitial" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.2);
       color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700">U</div>
</nav>

<div class="page-content">
  <div class="section-title"><i class="bi bi-building"></i> เลือกโรงงานที่ต้องการตรวจ</div>
  <p class="text-muted" style="font-size:0.85rem;margin-bottom:16px">
    รองรับ 3 Plant ตามมาตรฐาน 5ส Draft 2026
  </p>

  <div id="plantGrid" class="plant-grid">
    <!-- ดึงข้อมูลจาก API -->
    <div class="skeleton" style="height:80px;border-radius:12px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px"></div>
  </div>

  <!-- Step indicator -->
  <div style="margin-top:24px;padding:16px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm)">
    <div class="section-title" style="margin-bottom:12px"><i class="bi bi-list-check"></i> ขั้นตอนการตรวจ</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;
                    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">1</div>
        <div style="font-size:0.85rem"><strong>เลือก Plant</strong> — โรงงานที่ต้องการตรวจ</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--gray-300);color:var(--gray-600);
                    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">2</div>
        <div style="font-size:0.85rem;color:var(--gray-600)">เลือกพื้นที่ (Area) ที่ต้องการตรวจ</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--gray-300);color:var(--gray-600);
                    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">3</div>
        <div style="font-size:0.85rem;color:var(--gray-600)">ทำ Checklist และให้คะแนน</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--gray-300);color:var(--gray-600);
                    display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">4</div>
        <div style="font-size:0.85rem;color:var(--gray-600)">Submit และดูผล</div>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span>หน้าหลัก</span></button>
  <button class="bottom-nav-item active" data-page="plant"><i class="bi bi-clipboard-check"></i><span>ตรวจ</span></button>
  <button class="bottom-nav-item" onclick="navigate('history.html')"><i class="bi bi-clock-history"></i><span>ประวัติ</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span>Dashboard</span></button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
