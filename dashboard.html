<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <!-- Security headers (GitHub Pages ตั้ง HTTP header เองไม่ได้ จึงใช้ meta)
       ⚠️ ถ้าหน้าพัง/CDN โหลดไม่ขึ้น ให้ลบ 2 บรรทัดนี้ออกเพื่อย้อนกลับ
       'unsafe-inline' ยังต้องมีเพราะทุกหน้าใช้ inline onclick + <style> -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://oibjnkngraulcccdqevm.supabase.co; connect-src 'self' https://oibjnkngraulcccdqevm.supabase.co wss://oibjnkngraulcccdqevm.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Dashboard | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=54">

  <style>
    /* ---------- Ranking (อ่านง่ายบนมือถือ) ---------- */
    .rk-row{
      display:flex; align-items:center; gap:10px;
      padding:10px 0; border-bottom:1px solid rgba(16,24,40,.06);
    }
    .rk-row:last-child{ border-bottom:none }
    .rk-pos{
      width:26px; height:26px; border-radius:8px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:.72rem;
      background:#f2f5fa; color:var(--gray-600);
    }
    .rk-pos.m1{ background:#fdf3d7; color:#8a6200 }
    .rk-pos.m2{ background:#eceff3; color:#5b6470 }
    .rk-pos.m3{ background:#f7e6dc; color:#8a4b26 }
    .rk-mid{ flex:1; min-width:0 }
    .rk-name{
      font-size:.82rem; font-weight:600; color:var(--dark);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .rk-meta{ font-size:.66rem; color:var(--gray-600); margin-top:1px }
    .rk-track{ height:7px; border-radius:6px; background:var(--gray-200); overflow:hidden; margin-top:5px }
    .rk-fill{ height:100%; border-radius:6px; transition:width .9s ease }
    .rk-val{ flex-shrink:0; text-align:right; min-width:50px }
    .rk-pct{ font-size:1.05rem; font-weight:800; line-height:1.1 }
    .rk-band{ font-size:.6rem; font-weight:700; letter-spacing:.02em }

    /* ---------- เลือกรอบการตรวจ ---------- */
    .dash-round{
      display:flex; align-items:center; gap:9px; margin-bottom:12px;
      background:#fff; border:1px solid var(--hairline); border-radius:11px;
      padding:9px 12px; box-shadow:var(--shadow-sm);
    }
    .dash-round label{
      font-size:.68rem; font-weight:700; color:var(--gray-600);
      text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;
    }
    .dash-round select{
      flex:1; min-width:0; font-family:inherit; font-size:.85rem; font-weight:500;
      color:var(--gray-800); padding:6px 8px; border:1.5px solid var(--gray-300);
      border-radius:8px; background:#fff; -webkit-appearance:auto;
    }

    /* ---------- Filter (พื้นที่ต้องปรับปรุง) ---------- */
    .imp-filters{ display:flex; flex-direction:column; gap:9px; margin-bottom:4px }
    .imp-filters label{
      font-size:.68rem; font-weight:700; color:var(--gray-600);
      display:flex; flex-direction:column; gap:4px;
      text-transform:uppercase; letter-spacing:.03em;
    }
    .imp-filters select{
      font-family:inherit; font-size:.85rem; color:var(--gray-800);
      padding:9px 10px; border:1.5px solid var(--gray-300);
      border-radius:9px; background:#fff; -webkit-appearance:auto;
      text-transform:none; letter-spacing:0; font-weight:500;
    }
    .imp-filters select:disabled{ background:var(--gray-100); color:var(--gray-500) }

    /* ---------- สรุปผลการตรวจที่เลือก ---------- */
    .imp-summary{
      display:flex; align-items:center; gap:12px;
      padding:11px 13px; border-radius:10px; margin:13px 0 4px;
      background:var(--gray-100);
    }
    .imp-summary-pct{ font-size:1.4rem; font-weight:800; line-height:1 }
    .imp-summary-txt{ font-size:.72rem; color:var(--gray-600); line-height:1.45 }

    /* ---------- การ์ดข้อที่ตก ---------- */
    .imp-item{
      border:1px solid var(--hairline); border-radius:11px;
      padding:11px 12px; margin-bottom:9px; background:#fff;
    }
    .imp-item.s0{ border-left:4px solid var(--danger) }
    .imp-item.s1{ border-left:4px solid var(--warning) }
    .imp-head{ display:flex; align-items:flex-start; gap:8px; margin-bottom:6px }
    .imp-badge{
      flex-shrink:0; font-size:.63rem; font-weight:800;
      padding:3px 8px; border-radius:20px; white-space:nowrap;
    }
    .imp-badge.s0{ background:var(--red-bg); color:var(--danger) }
    .imp-badge.s1{ background:var(--amber-bg); color:var(--warning) }
    .imp-cat{ font-size:.63rem; color:var(--gray-500); font-weight:600; margin-bottom:2px }
    .imp-q{ font-size:.8rem; font-weight:600; color:var(--dark); line-height:1.45 }
    .imp-remark{
      font-size:.76rem; color:var(--gray-700); line-height:1.5;
      background:var(--gray-100); border-radius:8px;
      padding:7px 9px; margin-top:7px;
      display:flex; gap:6px; align-items:flex-start;
    }
    .imp-remark i{ color:var(--gray-500); flex-shrink:0; margin-top:2px }
    .imp-photos{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px }
    .imp-photos img{
      width:64px; height:64px; object-fit:cover; cursor:zoom-in;
      border-radius:8px; border:1px solid var(--hairline);
    }
    .imp-empty{ text-align:center; padding:26px 12px; color:var(--gray-600) }
    .imp-empty i{ font-size:2rem; display:block; margin-bottom:8px }
    .imp-empty-t{ font-size:.85rem; font-weight:700; color:var(--dark) }
    .imp-empty-d{ font-size:.75rem; margin-top:3px }

    /* ---------- ตัวนับ 0 / 1 ---------- */
    .imp-count{ display:flex; gap:8px; margin-bottom:10px }
    .imp-count span{ font-size:.72rem; padding:5px 10px; border-radius:8px }
    .imp-count-0{ background:var(--red-bg); color:var(--danger) }
    .imp-count-1{ background:var(--amber-bg); color:var(--warning) }

    /* ---------- Accordion (แตะแถวเพื่อกาง) ---------- */
    .imp-acc{
      border:1px solid var(--hairline); border-radius:11px;
      margin-bottom:9px; background:#fff; overflow:hidden; cursor:pointer;
    }
    .imp-acc.s0{ border-left:4px solid var(--danger) }
    .imp-acc.s1{ border-left:4px solid var(--warning) }
    .imp-acc-head{ display:flex; align-items:flex-start; gap:8px; padding:11px 12px }
    .imp-loc{ font-size:.66rem; color:var(--gray-500); margin-top:3px }
    .imp-chev{ flex-shrink:0; color:var(--gray-400); font-size:.8rem; transition:transform .2s; margin-top:2px }
    .imp-chev.open{ transform:rotate(180deg) }
    /* กางด้วย max-height เพื่อให้มี transition ลื่น */
    .imp-acc-body{ max-height:0; overflow:hidden; transition:max-height .28s ease; padding:0 12px }
    .imp-acc-body.open{ max-height:600px; padding:0 12px 12px }

    /* ---------- Lightbox ---------- */
    .imp-lightbox{
      position:fixed; inset:0; z-index:3000; display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.9); padding:20px;
    }
    .imp-lightbox.show{ display:flex }
    .imp-lightbox img{ max-width:100%; max-height:100%; border-radius:8px; object-fit:contain }
    .imp-lightbox-close{
      position:absolute; top:16px; right:16px; width:40px; height:40px;
      border-radius:50%; border:none; background:rgba(255,255,255,.15);
      color:#fff; font-size:1.1rem; cursor:pointer; display:flex;
      align-items:center; justify-content:center;
    }
  </style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg" data-i18n="loading">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px"><i class="bi bi-bar-chart-fill me-1"></i>Dashboard</div>
  <button class="btn-icon" onclick="exportDashboardPDF()" data-i18n-title="dash.export_pdf_title" title="Export PDF / ออกรายงาน PDF">
    <i class="bi bi-file-earmark-pdf"></i>
  </button>
  <button class="btn-icon" onclick="initDashboard()" data-i18n-title="btn.tooltip_refresh" title="รีเฟรช">
    <i class="bi bi-arrow-clockwise"></i>
  </button>
</nav>

<div class="page-content">

  <!-- 0) เลือกรอบการตรวจ — ซ่อนอัตโนมัติถ้าไม่มีรอบใดมีผลตรวจ -->
  <div id="dashRoundWrap" class="dash-round" style="display:none">
    <label for="dashRound" data-i18n="dash.round">รอบการตรวจ</label>
    <select id="dashRound" onchange="dashRoundChange(this.value)">
      <option value="" data-i18n="dash.all_rounds">ทุกรอบ</option>
    </select>
  </div>

  <!-- 1) Plant Ranking -->
  <div class="chart-container">
    <div class="chart-title">
      <i class="bi bi-trophy"></i> <span data-i18n="dash.plant_rank">Plant Ranking</span>
    </div>
    <div id="plantRanking">
      <div class="skeleton" style="height:44px;border-radius:8px;margin-bottom:7px"></div>
      <div class="skeleton" style="height:44px;border-radius:8px;margin-bottom:7px"></div>
      <div class="skeleton" style="height:44px;border-radius:8px"></div>
    </div>
  </div>

  <!-- 2) Area Ranking -->
  <div class="chart-container">
    <div class="chart-title">
      <i class="bi bi-grid"></i> <span data-i18n="dash.area_rank">Area Ranking</span>
    </div>
    <div id="areaRanking">
      <div class="skeleton" style="height:44px;border-radius:8px;margin-bottom:7px"></div>
      <div class="skeleton" style="height:44px;border-radius:8px;margin-bottom:7px"></div>
      <div class="skeleton" style="height:44px;border-radius:8px"></div>
    </div>
  </div>

  <!-- 3) พื้นที่ต้องปรับปรุง -->
  <div class="chart-container">
    <div class="chart-title">
      <i class="bi bi-exclamation-triangle"></i>
      <span data-i18n="imp.title">พื้นที่ต้องปรับปรุง</span>
    </div>

    <p style="font-size:.72rem;color:var(--gray-600);line-height:1.5;margin:0 0 10px">
      <span data-i18n="imp.hint">ข้อที่ตก (0–1) ของทุกพื้นที่ในรอบที่เลือก · แตะแต่ละข้อเพื่อดูหมายเหตุและรูป</span>
    </p>

    <div class="imp-filters">
      <label>
        <span data-i18n="imp.pick_plant">เลือกโรงงาน (ไม่บังคับ)</span>
        <select id="impPlant" onchange="impPlantChange(this.value)">
          <option value="" data-i18n="imp.all_plants">— ทุกโรงงาน —</option>
        </select>
      </label>
      <label>
        <span data-i18n="imp.pick_area">เลือกพื้นที่ (ไม่บังคับ)</span>
        <select id="impArea" onchange="impAreaChange(this.value)">
          <option value="" data-i18n="imp.all_areas">— ทุกพื้นที่ —</option>
        </select>
      </label>
    </div>

    <div id="impResult">
      <div class="skeleton" style="height:60px;border-radius:11px;margin-bottom:9px"></div>
      <div class="skeleton" style="height:60px;border-radius:11px;margin-bottom:9px"></div>
      <div class="skeleton" style="height:60px;border-radius:11px"></div>
    </div>
  </div>

</div>

<!-- Lightbox ซูมรูปเต็มจอ — แตะรูปในแถวที่กางอยู่เพื่อเปิด -->
<div id="impLightbox" class="imp-lightbox" onclick="impCloseZoom()">
  <button class="imp-lightbox-close" onclick="impCloseZoom()" data-i18n-aria="dash.lightbox_close" aria-label="ปิด"><i class="bi bi-x-lg"></i></button>
  <img id="impLightboxImg" src="" alt="">
</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span data-i18n="nav.home">หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('plant.html')"><i class="bi bi-clipboard-check"></i><span data-i18n="nav.audit">ตรวจ</span></button>
  <button class="bottom-nav-item" onclick="navigate('history.html')"><i class="bi bi-clock-history"></i><span data-i18n="nav.history">ประวัติ</span></button>
  <button class="bottom-nav-item active"><i class="bi bi-bar-chart"></i><span data-i18n="nav.dashboard">Dashboard</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=54"></script>
</body>
</html>
