<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <!-- Security headers (GitHub Pages ตั้ง HTTP header เองไม่ได้ จึงใช้ meta)
       ⚠️ ถ้าหน้าพัง/CDN โหลดไม่ขึ้น ให้ลบ 2 บรรทัดนี้ออกเพื่อย้อนกลับ
       'unsafe-inline' ยังต้องมีเพราะทุกหน้าใช้ inline onclick + <style> -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://oibjnkngraulcccdqevm.supabase.co; connect-src 'self' https://oibjnkngraulcccdqevm.supabase.co wss://oibjnkngraulcccdqevm.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#1b4ea8">
  <title>หน้าหลัก | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=50">
</head>
<body>

<!-- Loading -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <span class="loading-msg" data-i18n="loading">กำลังโหลด...</span>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>

<!-- Top Nav -->
<nav class="top-nav">
  <div id="userInitial" style="width:34px;height:34px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;flex-shrink:0">U</div>
  <div class="brand">หน้าหลัก</div>
  <div class="nav-actions">
    <button class="btn-icon" onclick="navigate('dashboard.html')" title="Dashboard">
      <i class="bi bi-bar-chart"></i>
    </button>
    <button class="btn-icon" onclick="logout()" data-i18n-title="btn.tooltip_logout" title="ออกจากระบบ">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</nav>

<!-- Content -->
<div class="page-content">

  <!-- Hero Card -->
  <div class="card mb-3" style="padding:20px 18px">
    <div id="heroMeta" style="font-size:0.72rem;color:var(--gray-600);font-weight:600;margin-bottom:8px"></div>
    <div style="font-size:1.3rem;font-weight:800;color:var(--dark);line-height:1.3;margin-bottom:6px">
      <span data-i18n="home.greeting_hi">สวัสดี</span> <span id="userName">-</span>
    </div>
    <div id="heroDesc" style="font-size:0.85rem;color:var(--gray-700);line-height:1.55;margin-bottom:16px">กำลังโหลด...</div>
    <button class="btn btn-primary btn-block btn-lg" id="startAuditBtn" onclick="navigate('mytasks.html')" style="min-height:52px">
      <i class="bi bi-clipboard-check"></i> <span data-i18n="home.start_btn">เริ่มตรวจ 5ส</span>
    </button>
  </div>

  <!-- Quick Stats -->
  <div class="stat-grid" style="margin-bottom:20px">
    <div class="stat-card blue">
      <div class="stat-number" id="totalAuditCount">-</div>
      <div class="stat-label" data-i18n="home.total_audit">การตรวจทั้งหมด</div>
    </div>
    <div class="stat-card green">
      <div class="stat-number" id="avgScoreHome">-</div>
      <div class="stat-label" data-i18n="home.avg_score">คะแนนเฉลี่ย</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-number" id="passRateHome">-</div>
      <div class="stat-label" data-i18n="home.pass_rate">อัตราผ่าน</div>
    </div>
    <div class="stat-card green">
      <div class="stat-number" id="excellentCount">-</div>
      <div class="stat-label" data-i18n="home.excellent">Excellent</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="section-title"><i class="bi bi-grid"></i> <span data-i18n="home.quick_menu">เมนูด่วน</span></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px"
       id="quickMenuGrid">
    <div class="card text-center" style="padding:14px 8px;cursor:pointer" onclick="navigate('history.html')">
      <i class="bi bi-clock-history" style="font-size:1.4rem;color:var(--primary)"></i>
      <div style="font-size:0.7rem;margin-top:6px;font-weight:500" data-i18n="home.menu_history">ประวัติ</div>
    </div>
    <div class="card text-center" style="padding:14px 8px;cursor:pointer" onclick="navigate('dashboard.html')">
      <i class="bi bi-bar-chart-fill" style="font-size:1.4rem;color:var(--secondary)"></i>
      <div style="font-size:0.7rem;margin-top:6px;font-weight:500" data-i18n="nav.dashboard">Dashboard</div>
    </div>
    <div class="card text-center" style="padding:14px 8px;cursor:pointer" onclick="navigate('criteria.html')">
      <i class="bi bi-book" style="font-size:1.4rem;color:var(--warning)"></i>
      <div style="font-size:0.7rem;margin-top:6px;font-weight:500">มาตรฐาน</div>
    </div>
    <!-- ตารางตรวจ — admin + auditor เห็นทั้งคู่ -->
    <div class="card text-center" style="padding:14px 8px;cursor:pointer" onclick="navigate('assign.html')">
      <i class="bi bi-clipboard-data" style="font-size:1.4rem;color:#0d9488"></i>
      <div style="font-size:0.7rem;margin-top:6px;font-weight:500">ตารางตรวจ</div>
    </div>
    <!-- Admin-only: มอบหมาย (แสดงสำหรับ Admin) -->
    <div class="card text-center" style="padding:14px 8px;cursor:pointer;display:none" id="menuSchedule"
         onclick="navigate('schedule.html')">
      <i class="bi bi-diagram-3" style="font-size:1.4rem;color:#9334e6"></i>
      <div style="font-size:0.7rem;margin-top:6px;font-weight:500">มอบหมาย</div>
    </div>
    <!-- Admin-only: จัดการผู้ใช้ -->
    <div class="card text-center" style="padding:14px 8px;cursor:pointer;display:none" id="menuUsers"
         onclick="navigate('users.html')">
      <i class="bi bi-people-fill" style="font-size:1.4rem;color:#ea4335"></i>
      <div style="font-size:0.7rem;margin-top:6px;font-weight:500" data-i18n="nav.users">ผู้ใช้</div>
    </div>
    <!-- Admin-only: บันทึกกิจกรรม -->
    <div class="card text-center" style="padding:14px 8px;cursor:pointer;display:none" id="menuLogs"
         onclick="navigate('logs.html')">
      <i class="bi bi-shield-lock" style="font-size:1.4rem;color:#0d9488"></i>
      <div style="font-size:0.7rem;margin-top:6px;font-weight:500">บันทึกกิจกรรม</div>
    </div>
  </div>

  <!-- Score Legend -->
  <div class="card">
    <div class="card-body">
      <div class="section-title" style="margin-bottom:10px">
        <i class="bi bi-info-circle"></i> <span data-i18n="home.score_title">เกณฑ์คะแนน</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--excellent);flex-shrink:0"></div>
          <div style="font-size:0.85rem" data-i18n="home.score_ex"><strong>90-100%</strong> — Excellent 🏆</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--warning);flex-shrink:0"></div>
          <div style="font-size:0.85rem" data-i18n="home.score_good"><strong>75-89%</strong> — Good ✅</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--danger);flex-shrink:0"></div>
          <div style="font-size:0.85rem" data-i18n="home.score_imp"><strong>0-74%</strong> — Need Improvement ⚠️</div>
        </div>
      </div>
      <hr style="border-color:var(--gray-200);margin:12px 0 8px">
      <div style="font-size:0.8rem;color:var(--gray-600)" data-i18n-html="home.score_desc_html">
        คะแนนแต่ละข้อ: <strong>2</strong>=ผ่าน &nbsp; <strong>1</strong>=บางส่วน &nbsp; <strong>0</strong>=ไม่ผ่าน
      </div>
    </div>
  </div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="bottom-nav-item active" data-page="home" onclick="navigate('home.html')">
    <i class="bi bi-house"></i><span data-i18n="nav.home">หน้าหลัก</span>
  </button>
  <button class="bottom-nav-item" data-page="plant" onclick="navigate('plant.html')">
    <i class="bi bi-clipboard-check"></i><span data-i18n="nav.audit">ตรวจ</span>
  </button>
  <button class="bottom-nav-item" data-page="history" onclick="navigate('history.html')">
    <i class="bi bi-clock-history"></i><span data-i18n="nav.history">ประวัติ</span>
  </button>
  <button class="bottom-nav-item" data-page="dashboard" onclick="navigate('dashboard.html')">
    <i class="bi bi-bar-chart"></i><span data-i18n="nav.dashboard">Dashboard</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=50"></script>
<script>
// Inline admin check — แสดง/ซ่อน menuSchedule ทันทีโดยไม่รอ app.js version
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('5s_session')||'null');
    var role = s && s.user && (s.user.role||s.user.Role||'');
    var isAdmin = typeof role==='string' && role.toLowerCase()==='admin';
    var ms = document.getElementById('menuSchedule');
    var mu = document.getElementById('menuUsers');
    if(ms) ms.style.display = isAdmin ? 'block' : 'none';
    if(mu) mu.style.display = isAdmin ? 'block' : 'none';
  } catch(e){}
})();
</script>
</body>
</html>
