<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>หน้าหลัก | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Loading -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <span class="loading-msg">กำลังโหลด...</span>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>

<!-- Top Nav -->
<nav class="top-nav">
  <div class="brand">
    <span style="background:#fff;color:var(--primary);border-radius:8px;padding:2px 8px;font-size:0.85rem;">5ส</span>
    ระบบตรวจ 5ส
  </div>
  <div class="nav-actions">
    <button class="btn-icon" onclick="navigate('dashboard.html')" title="Dashboard">
      <i class="bi bi-bar-chart"></i>
    </button>
    <button class="btn-icon" onclick="logout()" title="ออกจากระบบ">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</nav>

<!-- Content -->
<div class="page-content">

  <!-- User Greeting -->
  <div style="margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:50%;background:var(--primary);
                  color:#fff;display:flex;align-items:center;justify-content:center;
                  font-size:1.1rem;font-weight:700;flex-shrink:0" id="userInitial">U</div>
      <div>
        <div style="font-size:0.8rem;color:var(--gray-600)">สวัสดี 👋</div>
        <div style="font-weight:700;font-size:1rem" id="userName">-</div>
        <div style="font-size:0.75rem;color:var(--gray-600)" id="userRole"></div>
      </div>
    </div>
  </div>

  <!-- Quick Stats -->
  <div class="stat-grid" style="margin-bottom:20px">
    <div class="stat-card blue">
      <div class="stat-number" id="totalAuditCount">-</div>
      <div class="stat-label">การตรวจทั้งหมด</div>
    </div>
    <div class="stat-card green">
      <div class="stat-number" id="avgScoreHome">-</div>
      <div class="stat-label">คะแนนเฉลี่ย</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-number" id="passRateHome">-</div>
      <div class="stat-label">อัตราผ่าน</div>
    </div>
    <div class="stat-card green">
      <div class="stat-number" id="excellentCount">-</div>
      <div class="stat-label">Excellent</div>
    </div>
  </div>

  <!-- Next Audit Schedule -->
  <div class="card mb-3">
    <div class="card-header" style="background:var(--secondary)">
      <i class="bi bi-calendar-check me-2"></i>กำหนดการตรวจถัดไป
    </div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div class="text-muted" style="font-size:0.75rem">รอบการตรวจ</div>
          <div class="fw-bold" id="nextAuditRound">-</div>
        </div>
        <div>
          <div class="text-muted" style="font-size:0.75rem">วันที่</div>
          <div class="fw-bold" id="nextAuditDate">-</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Start Audit CTA -->
  <button class="btn btn-primary btn-block btn-lg mb-3" onclick="navigate('plant.html')"
          style="height:64px;font-size:1.1rem">
    <i class="bi bi-clipboard-check"></i> เริ่มตรวจ 5ส
  </button>

  <!-- Quick Actions -->
  <div class="section-title"><i class="bi bi-grid"></i> เมนูด่วน</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px">
    <div class="card text-center" style="padding:16px;cursor:pointer" onclick="navigate('history.html')">
      <i class="bi bi-clock-history" style="font-size:1.5rem;color:var(--primary)"></i>
      <div style="font-size:0.75rem;margin-top:6px;font-weight:500">ประวัติ</div>
    </div>
    <div class="card text-center" style="padding:16px;cursor:pointer" onclick="navigate('dashboard.html')">
      <i class="bi bi-bar-chart-fill" style="font-size:1.5rem;color:var(--secondary)"></i>
      <div style="font-size:0.75rem;margin-top:6px;font-weight:500">Dashboard</div>
    </div>
    <div class="card text-center" style="padding:16px;cursor:pointer" onclick="navigate('plant.html')">
      <i class="bi bi-building" style="font-size:1.5rem;color:var(--warning)"></i>
      <div style="font-size:0.75rem;margin-top:6px;font-weight:500">เลือก Plant</div>
    </div>
  </div>

  <!-- Score Legend -->
  <div class="card">
    <div class="card-body">
      <div class="section-title" style="margin-bottom:10px">
        <i class="bi bi-info-circle"></i> เกณฑ์คะแนน
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--excellent);flex-shrink:0"></div>
          <div style="font-size:0.85rem"><strong>90-100%</strong> — Excellent 🏆</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--warning);flex-shrink:0"></div>
          <div style="font-size:0.85rem"><strong>75-89%</strong> — Good ✅</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:12px;height:12px;border-radius:50%;background:var(--danger);flex-shrink:0"></div>
          <div style="font-size:0.85rem"><strong>0-74%</strong> — Need Improvement ⚠️</div>
        </div>
      </div>
      <hr style="border-color:var(--gray-200);margin:12px 0 8px">
      <div style="font-size:0.8rem;color:var(--gray-600)">
        คะแนนแต่ละข้อ: <strong>2</strong>=ผ่าน &nbsp; <strong>1</strong>=บางส่วน &nbsp; <strong>0</strong>=ไม่ผ่าน
      </div>
    </div>
  </div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="bottom-nav-item active" data-page="home" onclick="navigate('home.html')">
    <i class="bi bi-house"></i><span>หน้าหลัก</span>
  </button>
  <button class="bottom-nav-item" data-page="plant" onclick="navigate('plant.html')">
    <i class="bi bi-clipboard-check"></i><span>ตรวจ</span>
  </button>
  <button class="bottom-nav-item" data-page="history" onclick="navigate('history.html')">
    <i class="bi bi-clock-history"></i><span>ประวัติ</span>
  </button>
  <button class="bottom-nav-item" data-page="dashboard" onclick="navigate('dashboard.html')">
    <i class="bi bi-bar-chart"></i><span>Dashboard</span>
  </button>
  <button class="bottom-nav-item" data-page="admin" onclick="navigate('admin.html')" id="adminNav" style="display:none">
    <i class="bi bi-gear"></i><span>Admin</span>
  </button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
