<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>มอบหมายการตรวจ | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=16">
  <style>
    /* Plant Tabs */
    .plant-tab-bar {
      display: flex;
      gap: 0;
      overflow-x: auto;
      background: var(--primary);
      padding: 0 8px;
    }
    .plant-tab-bar::-webkit-scrollbar { display: none; }
    .plant-tab-btn {
      padding: 10px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.2s;
    }
    .plant-tab-btn.active {
      color: #fff;
      border-bottom-color: #fff;
    }

    /* Area Card Grid */
    .area-assign-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 600px) {
      .area-assign-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Area Card */
    .area-assign-card {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 12px 10px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.2s;
      border-top: 3px solid var(--gray-300);
    }
    .area-assign-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .area-assign-card.type-office      { border-top-color: var(--primary); }
    .area-assign-card.type-production  { border-top-color: var(--secondary); }
    .area-assign-card.type-warehouse   { border-top-color: var(--warning); }
    .area-assign-card.type-maintenance { border-top-color: var(--danger); }
    .area-assign-card.type-cafeteria   { border-top-color: #9334e6; }
    .area-assign-card.type-outdoor     { border-top-color: var(--secondary); }

    .area-type-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      margin-bottom: 8px;
    }
    .area-card-name {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 2px;
    }
    .area-card-meta {
      font-size: 0.68rem;
      color: var(--gray-600);
      margin-bottom: 8px;
    }

    /* Auditor chips on card */
    .card-auditor-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      min-height: 22px;
      margin-bottom: 8px;
    }
    .auditor-mini-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.66rem;
      background: var(--gray-100);
      border-radius: 20px;
      padding: 2px 6px 2px 2px;
    }
    .auditor-mini-avatar {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .card-date-row {
      font-size: 0.68rem;
      color: var(--gray-600);
      display: flex;
      align-items: center;
      gap: 4px;
      border-top: 1px solid var(--gray-200);
      padding-top: 7px;
      margin-bottom: 8px;
    }

    /* Status badge on card */
    .sched-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 20px;
    }
    .sched-status-badge.pending      { background: #fff8e1; color: #b06000; }
    .sched-status-badge.completed    { background: #e6f4ea; color: #137333; }
    .sched-status-badge.overdue      { background: #fce8e6; color: #c5221f; }
    .sched-status-badge.unassigned   { background: var(--gray-100); color: var(--gray-600); }

    /* Assign dashed button */
    .btn-assign-dashed {
      width: 100%;
      border: 1.5px dashed var(--gray-300);
      background: none;
      border-radius: var(--radius-sm);
      padding: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-assign-dashed:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(26,115,232,0.06);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal-sheet {
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 0;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s ease;
    }
    .modal-overlay.show .modal-sheet { transform: translateY(0); }
    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--gray-300);
      border-radius: 2px;
      margin: 12px auto 0;
    }
    .modal-header-bar {
      padding: 12px 20px 16px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    @media (min-width: 480px) {
      .modal-overlay { align-items: center; }
      .modal-sheet { border-radius: 16px; max-width: 480px; margin: 0 auto; }
    }

    /* Auditor select grid inside modal */
    .auditor-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .auditor-select-card {
      border: 1.5px solid var(--gray-300);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .auditor-select-card.selected {
      border-color: var(--primary);
      background: rgba(26,115,232,0.06);
    }
    .auditor-select-card .aud-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .auditor-select-card .check-icon {
      margin-left: auto;
      font-size: 1rem;
      color: var(--primary);
      display: none;
      flex-shrink: 0;
    }
    .auditor-select-card.selected .check-icon { display: block; }

    /* Area info block inside modal */
    .modal-area-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 20px;
    }
    .modal-area-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    /* Legend row */
    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      color: var(--gray-600);
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <span class="loading-msg">กำลังโหลด...</span>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>

<!-- Top Nav -->
<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px">
    <i class="bi bi-diagram-3 me-1"></i>มอบหมายการตรวจ
  </div>
  <span style="background:var(--warning);color:#fff;font-size:0.65rem;font-weight:700;
               padding:3px 8px;border-radius:20px;">
    <i class="bi bi-shield-check"></i> Admin
  </span>
</nav>

<!-- Plant Filter Tabs -->
<div class="plant-tab-bar" id="plantTabBar">
  <button class="plant-tab-btn active" onclick="schedFilterPlant('all', this)">ทั้งหมด</button>
</div>

<!-- Stats -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px;background:var(--gray-100);">
  <div class="stat-card blue text-center" style="padding:10px 6px;">
    <div class="stat-number" id="statAssigned" style="font-size:1.4rem">-</div>
    <div class="stat-label" style="font-size:0.65rem">มอบหมาย</div>
  </div>
  <div class="stat-card yellow text-center" style="padding:10px 6px;">
    <div class="stat-number" id="statPending" style="font-size:1.4rem">-</div>
    <div class="stat-label" style="font-size:0.65rem">รอมอบหมาย</div>
  </div>
  <div class="stat-card" style="padding:10px 6px;text-align:center;background:#fce8e6;">
    <div class="stat-number" id="statOverdue" style="font-size:1.4rem;color:var(--danger)">-</div>
    <div class="stat-label" style="font-size:0.65rem;color:var(--danger)">เกินกำหนด</div>
  </div>
  <div class="stat-card green text-center" style="padding:10px 6px;">
    <div class="stat-number" id="statTotal" style="font-size:1.4rem">-</div>
    <div class="stat-label" style="font-size:0.65rem">พื้นที่ทั้งหมด</div>
  </div>
</div>

<!-- Legend -->
<div class="legend-row">
  <div class="legend-item"><div class="legend-dot" style="background:var(--warning)"></div>รอตรวจ</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--secondary)"></div>ตรวจแล้ว</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>เกินกำหนด</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--gray-400)"></div>ยังไม่มีตาราง</div>
</div>

<!-- Area Grid -->
<div class="page-content" style="padding-top:12px;">
  <div class="area-assign-grid" id="areaGrid">
    <div class="skeleton" style="height:160px;border-radius:var(--radius-md)"></div>
    <div class="skeleton" style="height:160px;border-radius:var(--radius-md)"></div>
    <div class="skeleton" style="height:160px;border-radius:var(--radius-md)"></div>
    <div class="skeleton" style="height:160px;border-radius:var(--radius-md)"></div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="bottom-nav-item active" onclick="navigate('home.html')"><i class="bi bi-house"></i><span>หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('plant.html')"><i class="bi bi-clipboard-check"></i><span>ตรวจ</span></button>
  <button class="bottom-nav-item" onclick="navigate('history.html')"><i class="bi bi-clock-history"></i><span>ประวัติ</span></button>
  <button class="bottom-nav-item" onclick="navigate('users.html')"><i class="bi bi-people"></i><span>ผู้ใช้</span></button>
</nav>

<!-- Modal: Assign -->
<div id="assignModal" class="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header-bar">
      <div style="font-size:1rem;font-weight:700" id="modalTitle">มอบหมายการตรวจ</div>
      <button class="btn-icon" onclick="closeAssignModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div style="padding:20px;">
      <!-- Area Info -->
      <div class="modal-area-info" id="modalAreaInfo"></div>

      <!-- Auditor Selection -->
      <div style="font-size:0.78rem;font-weight:700;color:var(--gray-600);
                  text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;">
        เลือกผู้ตรวจ <span style="font-size:0.7rem;font-weight:400;text-transform:none;">(เลือกได้หลายคน)</span>
      </div>
      <div class="auditor-select-grid" id="auditorSelectGrid"></div>

      <!-- Schedule -->
      <div style="font-size:0.78rem;font-weight:700;color:var(--gray-600);
                  text-transform:uppercase;letter-spacing:0.04em;margin:16px 0 10px;">
        กำหนดตาราง
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;">
        <div class="form-group" style="margin:0">
          <label class="form-label" style="font-size:0.75rem">วันที่ตรวจ</label>
          <input type="date" id="schedDate" class="form-control" style="font-size:0.85rem;">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label" style="font-size:0.75rem">รอบที่</label>
          <select id="schedRound" class="form-control" style="font-size:0.85rem;-webkit-appearance:auto;">
            <option value="Round 1">รอบที่ 1</option>
            <option value="Round 2" selected>รอบที่ 2</option>
            <option value="Round 3">รอบที่ 3</option>
            <option value="Round 4">รอบที่ 4</option>
          </select>
        </div>
      </div>

      <!-- Delete link -->
      <div id="deleteSchedRow" style="display:none;text-align:right;margin-bottom:4px;">
        <button onclick="deleteSchedule()" style="background:none;border:none;color:var(--danger);
                font-size:0.75rem;cursor:pointer;font-family:inherit;padding:4px;">
          <i class="bi bi-trash3"></i> ยกเลิกตารางตรวจนี้
        </button>
      </div>

      <!-- Save button -->
      <button class="btn btn-primary btn-block mt-3" id="saveSchedBtn" onclick="saveSchedule()">
        <i class="bi bi-check-lg"></i> บันทึกการมอบหมาย
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=16"></script>
</body>
</html>
