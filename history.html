<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ประวัติการตรวจ | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px">ประวัติการตรวจ</div>
</nav>

<div class="page-content">

  <!-- Filter Bar -->
  <div class="filter-bar">
    <select id="filterPlant" class="filter-select" onchange="applyHistoryFilter()">
      <option value="">🏭 ทุก Plant</option>
    </select>
    <select id="filterMonth" class="filter-select" onchange="applyHistoryFilter()">
      <option value="">📅 ทุกเดือน</option>
      <option value="1">มกราคม</option>
      <option value="2">กุมภาพันธ์</option>
      <option value="3">มีนาคม</option>
      <option value="4">เมษายน</option>
      <option value="5">พฤษภาคม</option>
      <option value="6">มิถุนายน</option>
      <option value="7">กรกฎาคม</option>
      <option value="8">สิงหาคม</option>
      <option value="9">กันยายน</option>
      <option value="10">ตุลาคม</option>
      <option value="11">พฤศจิกายน</option>
      <option value="12">ธันวาคม</option>
    </select>
    <select id="filterYear" class="filter-select" onchange="applyHistoryFilter()">
      <option value="">📆 ทุกปี</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
    </select>
    <button class="btn btn-outline btn-sm" onclick="applyHistoryFilter()" style="flex-shrink:0">
      <i class="bi bi-search"></i>
    </button>
  </div>

  <!-- History List -->
  <div id="historyList">
    <div class="skeleton" style="height:72px;border-radius:10px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:72px;border-radius:10px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:72px;border-radius:10px;margin-bottom:8px"></div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span>หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('plant.html')"><i class="bi bi-clipboard-check"></i><span>ตรวจ</span></button>
  <button class="bottom-nav-item active"><i class="bi bi-clock-history"></i><span>ประวัติ</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span>Dashboard</span></button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
