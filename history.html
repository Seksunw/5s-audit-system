<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <!-- Security headers (GitHub Pages ตั้ง HTTP header เองไม่ได้ จึงใช้ meta)
       ⚠️ ถ้าหน้าพัง/CDN โหลดไม่ขึ้น ให้ลบ 2 บรรทัดนี้ออกเพื่อย้อนกลับ
       'unsafe-inline' ยังต้องมีเพราะทุกหน้าใช้ inline onclick + <style> -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://oibjnkngraulcccdqevm.supabase.co; connect-src 'self' https://oibjnkngraulcccdqevm.supabase.co wss://oibjnkngraulcccdqevm.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ประวัติการตรวจ | ระบบตรวจ 5ส</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=40">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"><div class="spinner"></div><span class="loading-msg" data-i18n="loading">กำลังโหลด...</span></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<nav class="top-nav">
  <button class="btn-icon" onclick="navigate('home.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="brand" style="margin-left:8px" data-i18n="history.title">ประวัติการตรวจ</div>
</nav>

<div class="page-content">

  <!-- Filter Bar -->
  <div class="filter-bar">
    <select id="filterPlant" class="filter-select" onchange="applyHistoryFilter()">
      <option value="" data-i18n="history.all_plant">🏭 ทุก Plant</option>
    </select>
    <select id="filterMonth" class="filter-select" onchange="applyHistoryFilter()">
      <option value="" data-i18n="history.all_month">📅 ทุกเดือน</option>
      <option value="1" data-i18n="month.1">มกราคม</option>
      <option value="2" data-i18n="month.2">กุมภาพันธ์</option>
      <option value="3" data-i18n="month.3">มีนาคม</option>
      <option value="4" data-i18n="month.4">เมษายน</option>
      <option value="5" data-i18n="month.5">พฤษภาคม</option>
      <option value="6" data-i18n="month.6">มิถุนายน</option>
      <option value="7" data-i18n="month.7">กรกฎาคม</option>
      <option value="8" data-i18n="month.8">สิงหาคม</option>
      <option value="9" data-i18n="month.9">กันยายน</option>
      <option value="10" data-i18n="month.10">ตุลาคม</option>
      <option value="11" data-i18n="month.11">พฤศจิกายน</option>
      <option value="12" data-i18n="month.12">ธันวาคม</option>
    </select>
    <select id="filterYear" class="filter-select" onchange="applyHistoryFilter()">
      <option value="" data-i18n="history.all_year">📆 ทุกปี</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
    </select>
    <button class="btn btn-outline btn-sm" onclick="applyHistoryFilter()" style="flex-shrink:0">
      <i class="bi bi-search"></i>
    </button>
  </div>

  <!-- History List -->
  <div id="historyList">
    <div class="skeleton" style="height:72px;border-radius:10px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:72px;border-radius:10px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:72px;border-radius:10px;margin-bottom:8px"></div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="navigate('home.html')"><i class="bi bi-house"></i><span data-i18n="nav.home">หน้าหลัก</span></button>
  <button class="bottom-nav-item" onclick="navigate('plant.html')"><i class="bi bi-clipboard-check"></i><span data-i18n="nav.audit">ตรวจ</span></button>
  <button class="bottom-nav-item active"><i class="bi bi-clock-history"></i><span data-i18n="nav.history">ประวัติ</span></button>
  <button class="bottom-nav-item" onclick="navigate('dashboard.html')"><i class="bi bi-bar-chart"></i><span data-i18n="nav.dashboard">Dashboard</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=40"></script>
</body>
</html>
